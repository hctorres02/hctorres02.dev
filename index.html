<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="PROFILE_NAME">
        <meta name="description" content="PROFILE_DESCRIPTION">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="PROFILE_NAME">
        <meta name="twitter:description" content="PROFILE_DESCRIPTION">
        <meta name="twitter:image" content="PROFILE_URL/og-image.png">
        <meta name="twitter:image:alt" content="PROFILE_NAME">
        <meta property="og:type" content="website">
        <meta property="og:url" content="PROFILE_URL">
        <meta property="og:site_name" content="PROFILE_NAME">
        <meta property="og:title" content="PROFILE_NAME">
        <meta property="og:description" content="PROFILE_DESCRIPTION">
        <meta property="og:image" content="PROFILE_URL/og-image.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="PROFILE_NAME">
        <link rel="canonical" href="PROFILE_URL">
        <link rel="manifest" href="/manifest.json">
        <link rel="icon" href="PROFILE_AVATAR?s=48&v=4" type="image/png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <link rel="stylesheet" href="/style.css">
        <title>PROFILE_NAME</title>
    </head>

    <body>
        <div id="app" class="container">
            <header>
                <hgroup>
                    <h1>{{ profile.name }}</h1>
                    <p>{{ profile.motto }}</p>
                </hgroup>
            </header>
            <main>
                <p>{{ profile.description }}</p>
                <nav aria-label="Links">
                    <ul>
                        <li v-for="link in links" :key="link.href">
                            <a :href="link.href" target="_blank" rel="noopener noreferrer">
                                <svg v-if="link.icon" class="link-icon" viewBox="0 0 496 512" fill="currentColor"
                                    aria-hidden="true">
                                    <path :d="link.icon"></path>
                                </svg>
                                <span>{{ link.label }}</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </main>
            <footer>
                <p>
                    <small>
                        Feito com <a href="https://picocss.com" target="_blank" rel="noopener noreferrer">Pico CSS</a>.
                    </small>
                </p>
            </footer>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.min.js"></script>
        <script type="module">
            import profile from './profile.json' with { type: 'json' }
            import links from './links.json' with { type: 'json' }

            const { createApp } = Vue

            createApp({
                data() {
                    return {
                        profile,
                        links,
                    }
                },
            }).mount('#app')
        </script>
    </body>

</html>

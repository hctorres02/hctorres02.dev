name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail

          mkdir dist

          cp index.html dist/
          cp style.css dist/
          cp app.js dist/

          style_hash=$(sha256sum dist/style.css | cut -c1-8)
          app_hash=$(sha256sum dist/app.js | cut -c1-8)

          mv "dist/style.css" "dist/style.${style_hash}.css"
          mv "dist/app.js" "dist/app.${app_hash}.js"

          sed -i \
            "s|/style.css|/style.${style_hash}.css|g" \
            dist/index.html

          sed -i \
            "s|/app.js|/app.${app_hash}.js|g" \
            dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4